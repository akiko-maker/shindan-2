  font-style: italic;
  font-size: 0.45em;
  color: #b07090;

}

.hero-desc {

  line-height: 1.6;
  margin-bottom: 32px;
  min-height: 80px;
  color: #3a1a28;
}

.options { display: flex; flex-direction: column; gap: 12px; }

.opt {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 18px 20px;
  background: white;
  border: 1.5px solid #f4c0cc;
  border-radius: 14px;

  color: #3a1a28;

  box-shadow: 0 2px 8px rgba(192,84,122,0.07);
}

  border-color: #c0547a;
  background: #fff0f4;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(192,84,122,0.15);
}

  flex-shrink: 0;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #ffe0ea;

  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 14px;
  color: #c0547a;
  transition: all 0.18s;
}
.opt:hover .opt-letter {
  background: #c0547a;
  color: white;
}

/* ===== RESULT ===== */

  min-height: 100vh;

  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
.anim { opacity: 0; }
.anim.go { animation: fadeUp 0.5s forwards; }
</style>
</head>

function startQuiz() {
  document.getElementById('hero').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion(1, 0);
}

function renderQuestion(id, step) {
  const q = questions.find(q => q.id === id);
  if (!q) return;

  const pct = Math.round((step / 5) * 90);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepLabel').textContent = 'Question ' + (step + 1);
  document.getElementById('questionText').textContent = q.text;

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  q.options.forEach(function(opt) {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<div class="opt-letter">' + opt.label + '</div><div>' + opt.text + '</div>';
    btn.onclick = function() { choose(opt.next, step + 1); };
    wrap.appendChild(btn);
  });
}

function choose(next, step) {
  if (typeof next === 'string') {
    showResult(next);
  } else {
    renderQuestion(next, step);
  }
}

function showResult(key) {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('quiz').style.display = 'none';

  const data = results[key];
  document.getElementById('resultTitle').textContent = data.icon + ' ' + data.title;
  document.getElementById('resultBadge').innerHTML = 'グループ <span class="num">' + data.group + '</span>';
  // 特徴行をピンク太字で表示
  var descParts = data.desc.split('\n\n');
  var featLine = descParts[0].replace('【特徴】', '');
  var bodyText = descParts[1] || '';
  document.getElementById('resultDesc').innerHTML =
    '<span style="display:block;color:#c0547a;font-weight:700;font-size:13px;letter-spacing:0.1em;margin-bottom:10px;">✦ ' + featLine + '</span>' + bodyText;
  document.getElementById('resultAdvice').textContent = data.advice;
  document.getElementById('resultTags').innerHTML = data.tags.map(function(t) {
    return '<span class="tag">' + t + '</span>';
  }).join('');

  document.getElementById('result').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetQuiz() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('hero').style.display = 'flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
